baseURL = "https://kamil.sijko.pl/"
theme = "PaperMod"

defaultContentLanguage = "pl"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  defaultTheme = "auto"
  disableThemeToggle = false
  displayFullLangName = true
  disableLangToggle = false

  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/kamilsi"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/ksijko/"

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/SijkoKamil"

[languages]
  [languages.pl]
    locale = "pl"
    label = "Polski"
    weight = 1
    title = "Kamil Sijko"

    [languages.pl.params]
      description = "Dane, przestrzeń ukryta (latent space), autorski dźwięk i sprawy lokalne."
      keywords = ["Kamil Sijko", "dane", "latent space", "muzyka", "analiza danych"]
      author = "Kamil Sijko"
      DateFormat = "2 January 2006"

      [languages.pl.params.profileMode]
        enabled = true
        title = "Kamil Sijko"
        subtitle = "Data all around • Latent space • Dźwięk autorski • Sprawy lokalne"
        imageUrl = "/images/binary-code.png"
        imageTitle = "Kamil Sijko"
        imageWidth = 120
        imageHeight = 120
        buttons = [
          { name = "Artykuły", url = "post/" },
          { name = "Muzyka", url = "muzyka/" },
          { name = "Latent Space", url = "latent-space/" },
          { name = "O mnie", url = "about/" },
        ]

    [languages.pl.menu]
      [[languages.pl.menu.main]]
        identifier = "post"
        name = "Artykuły"
        url = "post/"
        weight = 10

      [[languages.pl.menu.main]]
        identifier = "muzyka"
        name = "Muzyka"
        url = "muzyka/"
        weight = 20

      [[languages.pl.menu.main]]
        identifier = "latent-space"
        name = "Latent Space"
        url = "latent-space/"
        weight = 30

      [[languages.pl.menu.main]]
        identifier = "tags"
        name = "Tagi"
        url = "tags/"
        weight = 40

      [[languages.pl.menu.main]]
        identifier = "about"
        name = "O mnie"
        url = "about/"
        weight = 50

  [languages.en]
    locale = "en"
    label = "English"
    weight = 2
    title = "Kamil Sijko"

    [languages.en.params]
      description = "Data, latent space exploration, original sound and local insights."
      keywords = ["Kamil Sijko", "data", "latent space", "music", "data analysis"]
      author = "Kamil Sijko"
      DateFormat = "January 2, 2006"

      [languages.en.params.profileMode]
        enabled = true
        title = "Kamil Sijko"
        subtitle = "Data all around • Latent space • Original sound • Local insights"
        imageUrl = "/images/binary-code.png"
        imageTitle = "Kamil Sijko"
        imageWidth = 120
        imageHeight = 120
        buttons = [
          { name = "Posts", url = "post/" },
          { name = "Music", url = "muzyka/" },
          { name = "Latent Space", url = "latent-space/" },
          { name = "About", url = "about/" },
        ]

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "post"
        name = "Posts"
        url = "post/"
        weight = 10

      [[languages.en.menu.main]]
        identifier = "muzyka"
        name = "Music"
        url = "muzyka/"
        weight = 20

      [[languages.en.menu.main]]
        identifier = "latent-space"
        name = "Latent Space"
        url = "latent-space/"
        weight = 30

      [[languages.en.menu.main]]
        identifier = "tags"
        name = "Tags"
        url = "tags/"
        weight = 40

      [[languages.en.menu.main]]
        identifier = "about"
        name = "About"
        url = "about/"
        weight = 50
