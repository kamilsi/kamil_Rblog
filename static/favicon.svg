<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#0f172a"/>
  <!-- 3x3 Grid -->
  <rect x="106" y="106" width="300" height="300" rx="4" fill="none" stroke="#334155" stroke-width="8"/>
  <line x1="106" y1="206" x2="406" y2="206" stroke="#334155" stroke-width="8"/>
  <line x1="106" y1="306" x2="406" y2="306" stroke="#334155" stroke-width="8"/>
  <line x1="206" y1="106" x2="206" y2="406" stroke="#334155" stroke-width="8"/>
  <line x1="306" y1="106" x2="306" y2="406" stroke="#334155" stroke-width="8"/>
  <!-- Glider Live Cells (5 dots) with cyan halo -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- (0,1) -->
  <circle cx="256" cy="156" r="35" fill="#ffffff" filter="url(#glow)"/>
  <!-- (1,2) -->
  <circle cx="356" cy="256" r="35" fill="#ffffff" filter="url(#glow)"/>
  <!-- (2,0) -->
  <circle cx="156" cy="356" r="35" fill="#ffffff" filter="url(#glow)"/>
  <!-- (2,1) -->
  <circle cx="256" cy="356" r="35" fill="#ffffff" filter="url(#glow)"/>
  <!-- (2,2) -->
  <circle cx="356" cy="356" r="35" fill="#ffffff" filter="url(#glow)"/>
</svg>
